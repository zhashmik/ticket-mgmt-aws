<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ticket Management</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo">🎫</span>
            <span class="brand-name">Ticket Management</span>
        </div>
        <div class="env-badge" id="envBadge">connecting…</div>
    </header>

    <main class="layout">
        <section class="stats" id="stats"></section>

        <div class="grid">
            <section class="card">
                <div class="card-head">
                    <h2>Tickets</h2>
                    <div class="filters">
                        <select id="statusFilter">
                            <option value="">All statuses</option>
                        </select>
                        <button class="btn ghost" id="refreshBtn">Refresh</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table id="ticketTable">
                        <thead>
                            <tr>
                                <th>#</th><th>Title</th><th>Priority</th>
                                <th>Status</th><th>Created</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="ticketBody"></tbody>
                    </table>
                </div>
                <div class="pager">
                    <button class="btn ghost" id="prevPage">&larr; Prev</button>
                    <span id="pageInfo">page 1</span>
                    <button class="btn ghost" id="nextPage">Next &rarr;</button>
                </div>
            </section>

            <section class="card">
                <div class="card-head"><h2>New Ticket</h2></div>
                <form id="createForm" class="form">
                    <label>Title
                        <input name="title" required maxlength="255" placeholder="Short summary">
                    </label>
                    <label>Description
                        <textarea name="description" rows="3" placeholder="Details"></textarea>
                    </label>
                    <div class="row">
                        <label>Priority
                            <select name="priority">
                                <option>LOW</option>
                                <option selected>MEDIUM</option>
                                <option>HIGH</option>
                                <option>CRITICAL</option>
                            </select>
                        </label>
                        <label>Category
                            <input name="category" placeholder="e.g. Hardware">
                        </label>
                    </div>
                    <div class="row">
                        <label>Created by
                            <select name="createdById" id="creatorSelect"></select>
                        </label>
                        <label>Assignee (optional)
                            <select name="assigneeId" id="assigneeSelect">
                                <option value="">— none —</option>
                            </select>
                        </label>
                    </div>
                    <button class="btn primary" type="submit">Create Ticket</button>
                    <p class="form-msg" id="formMsg"></p>
                </form>
            </section>
        </div>
    </main>

    <!-- Ticket detail modal -->
    <div class="modal-backdrop hidden" id="modal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="modalTitle">Ticket</h3>
                <button class="icon-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
