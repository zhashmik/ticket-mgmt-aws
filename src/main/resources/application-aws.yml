spring:
  datasource:
    url: jdbc:mysql://${DB_ENDPOINT}:3306/ticket_mgmt?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: none

aws:
  region: ${AWS_REGION:us-west-2}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    issuer-uri: https://cognito-idp.${aws.region}.amazonaws.com/${aws.cognito.user-pool-id}
  s3:
    bucket-name: ${S3_BUCKET_NAME}
    presigned-url-expiry-minutes: 15
  ses:
    from-email: ${SES_FROM_EMAIL}
    reply-to-email: ${SES_REPLY_TO_EMAIL:noreply@ticketmgmt.com}
  sns:
    ticket-events-topic-arn: ${SNS_TICKET_EVENTS_TOPIC_ARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true

logging:
  level:
    root: INFO
    com.ticketmgmt: INFO
    org.hibernate.SQL: WARN
