spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: ticket-gateway-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

---
# Local profile — zero-setup in-memory H2, seeded with demo data
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ticket_mgmt;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /api

---
# Docker profile — MySQL via docker-compose
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${DB_ENDPOINT:mysql}:3306/ticket_mgmt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:localdev123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /api
